# Producción: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Agrega el proxy (Caddy) delante de todo: HTTPS automático para DOMINIO, cabeceras de
# seguridad, fotos públicas servidas directo del volumen y la API detrás del proxy (la IP del
# cliente sale de X-Forwarded-For). Ningún otro servicio publica puertos.

services:
  proxy:
    image: caddy:2.11.9
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en .env (p. ej. diamante.co)}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
      - archivos:/srv/media:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    environment:
      DIAMANTE_CONFIAR_PROXY: "true"

volumes:
  caddy_datos:
  caddy_config:
