# Ambiente de pruebas E2E: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --wait
# Base de datos en memoria (desechable y rápida) y Mailpit para leer las invitaciones y los
# enlaces de recuperación (E2E-AUT-03 y 04). En fases siguientes se agregan el frontend, la
# feature `pruebas-e2e` del backend y el reloj controlable.

services:
  db:
    # Reemplaza (no fusiona) los volúmenes de la base: sin volumen persistente, datos en memoria.
    volumes: !override
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql

  migraciones:
    environment:
      DIAMANTE_ENTORNO: pruebas

  api:
    environment:
      DIAMANTE_ENTORNO: pruebas
      # WhatsApp simulado: GET /api/v1/_pruebas/mensajes muestra los mensajes en cola (códigos).
      DIAMANTE_PRUEBAS_E2E: "true"
      DIAMANTE_URL_PUBLICA: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    environment:
      DIAMANTE_ENTORNO: pruebas
      DIAMANTE_URL_PUBLICA: http://localhost:8080
      DIAMANTE_SMTP_HOST: mailpit
      DIAMANTE_SMTP_PUERTO: "1025"
      DIAMANTE_SMTP_SEGURIDAD: ninguna
      DIAMANTE_SMTP_REMITENTE: Diamante Barbería <no-responder@diamante.local>
    depends_on:
      mailpit: { condition: service_started }

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:8025:8025"
