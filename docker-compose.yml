# Docker Compose base (producción): base de datos, backend (API, worker y migraciones),
# Gotenberg (PDF de los reportes) y respaldos. El frontend se agrega en su fase.
#
# En producción lo despliega Dokploy con este archivo solo: su Traefik termina HTTPS y enruta
# el dominio a los servicios (ver docs/operacion/runbook.md). Ningún servicio publica puertos.
#
# Desarrollo:  docker compose up            (carga también docker-compose.override.yml)
# Producción:  docker compose -f docker-compose.yml up -d

name: diamante

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  image: diamante-backend:${VERSION:-local}
  restart: unless-stopped

# Variables de la aplicación que comparten la API y el worker. Las vacías se ignoran; en
# producción, DIAMANTE_URL_PUBLICA es obligatoria y el proceso no arranca sin ella.
x-entorno-app: &entorno-app
  # La contraseña va aparte (PGPASSWORD), no dentro de la URL: así sirve cualquier carácter
  # (también / + = de las claves en base64).
  DATABASE_URL: ${DIAMANTE_DB_URL:-postgres://diamante_app@db:5432/diamante}
  PGPASSWORD: ${DIAMANTE_APP_PASSWORD}
  DIAMANTE_ENTORNO: ${DIAMANTE_ENTORNO:-produccion}
  DIAMANTE_URL_PUBLICA: ${DIAMANTE_URL_PUBLICA:-}
  DIAMANTE_ORIGENES: ${DIAMANTE_ORIGENES:-}
  DIAMANTE_CONFIAR_PROXY: ${DIAMANTE_CONFIAR_PROXY:-false}
  DIAMANTE_PRUEBAS_E2E: ${DIAMANTE_PRUEBAS_E2E:-false}
  DIAMANTE_WORKER_EN_API: ${DIAMANTE_WORKER_EN_API:-false}
  # Webhook de WhatsApp (secreto de la app de Meta y token de verificación).
  DIAMANTE_WHATSAPP_SECRETO_APP: ${DIAMANTE_WHATSAPP_SECRETO_APP:-}
  DIAMANTE_WHATSAPP_TOKEN_VERIFICACION: ${DIAMANTE_WHATSAPP_TOKEN_VERIFICACION:-}
  # Firmas de las URL de descarga y cifrado de los datos sensibles (obligatorias en producción).
  DIAMANTE_CLAVE_FIRMA: ${DIAMANTE_CLAVE_FIRMA:-}
  DIAMANTE_CLAVE_CIFRADO: ${DIAMANTE_CLAVE_CIFRADO:-}
  # PDF de los reportes (sin Gotenberg, las descargas responden 503 y lo demás funciona).
  DIAMANTE_GOTENBERG_URL: ${DIAMANTE_GOTENBERG_URL:-http://gotenberg:3000}
  DIAMANTE_LIMITES_DE_USO: ${DIAMANTE_LIMITES_DE_USO:-true}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: diamante
      POSTGRES_USER: diamante_propietario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      DIAMANTE_APP_PASSWORD: ${DIAMANTE_APP_PASSWORD:?Defina DIAMANTE_APP_PASSWORD en .env}
      # Rol de solo lectura de los respaldos (se crea con el volumen; ver docs/operacion/runbook.md).
      DIAMANTE_RESPALDO_PASSWORD: ${DIAMANTE_RESPALDO_PASSWORD:-}
    volumes:
      - db_datos:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamante_propietario -d diamante"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Sin "ports": la base de datos no se expone fuera de la red de Docker (RNF-DES-02).

  migraciones:
    <<: *backend
    command: ["migrar"]
    environment:
      DATABASE_URL: postgres://diamante_propietario@db:5432/diamante
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DIAMANTE_ENTORNO: ${DIAMANTE_ENTORNO:-produccion}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *entorno-app
    # Fotos y documentos (/media/publico/* y descargas privadas firmadas).
    volumes:
      - archivos:/datos/archivos
    depends_on:
      migraciones: { condition: service_completed_successfully }
      gotenberg: { condition: service_started }
    healthcheck:
      test: ["CMD", "/app/diamante", "salud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Envía los correos en cola (invitaciones y recuperación de contraseña).
  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *entorno-app
      DIAMANTE_SMTP_HOST: ${DIAMANTE_SMTP_HOST:-}
      DIAMANTE_SMTP_PUERTO: ${DIAMANTE_SMTP_PUERTO:-}
      DIAMANTE_SMTP_SEGURIDAD: ${DIAMANTE_SMTP_SEGURIDAD:-}
      DIAMANTE_SMTP_USUARIO: ${DIAMANTE_SMTP_USUARIO:-}
      DIAMANTE_SMTP_CLAVE: ${DIAMANTE_SMTP_CLAVE:-}
      DIAMANTE_SMTP_REMITENTE: ${DIAMANTE_SMTP_REMITENTE:-}
    depends_on:
      migraciones: { condition: service_completed_successfully }

  # HTML → PDF de los reportes (RF-REP-06). Solo en la red interna. Chromium sin JavaScript y
  # sin red (solo los archivos que recibe en /tmp): si algún dato llegara sin escapar, no
  # podría cargar nada de afuera ni de la red interna. Sin LibreOffice ni webhooks.
  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --libreoffice-disable-routes=true
      - --webhook-disable=true
      - --prometheus-disable-collect=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Respaldos (RNF-BAK): la base cada hora (48 h) y, a diario, base y archivos (30 días), con
  # copia externa cifrada por rclone si se configura y prueba de restauración los domingos.
  respaldo:
    build:
      context: .
      dockerfile: infra/docker/respaldo.Dockerfile
    image: diamante-respaldo:${VERSION:-local}
    environment:
      PGHOST: db
      PGDATABASE: diamante
      PGUSER: diamante_respaldo
      PGPASSWORD: ${DIAMANTE_RESPALDO_PASSWORD:-}
      DIAMANTE_RESPALDO_REMOTO: ${DIAMANTE_RESPALDO_REMOTO:-}
      # rclone.conf en base64 (alternativa al archivo de infra/respaldo/rclone, p. ej. en Dokploy).
      DIAMANTE_RESPALDO_RCLONE_CONF_B64: ${DIAMANTE_RESPALDO_RCLONE_CONF_B64:-}
      DIAMANTE_RESPALDO_CADA_MINUTOS: ${DIAMANTE_RESPALDO_CADA_MINUTOS:-60}
      DIAMANTE_RESPALDO_HORA_DIARIA: ${DIAMANTE_RESPALDO_HORA_DIARIA:-2}
      DIAMANTE_RESPALDO_RETENCION_DIAS: ${DIAMANTE_RESPALDO_RETENCION_DIAS:-30}
    volumes:
      - respaldos:/respaldos
      - archivos:/datos/archivos:ro
      - ./infra/respaldo/rclone:/config/rclone:ro
    # Después de las migraciones: el primer respaldo de un despliegue nuevo ya tiene el esquema.
    depends_on:
      migraciones: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  db_datos:
  archivos:
  respaldos:
