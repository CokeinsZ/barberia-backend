# Docker Compose base (producción). Fases 0 y 1: base de datos y backend (API, worker y
# migraciones). El proxy (Caddy), el frontend, Gotenberg y los respaldos se agregan en sus fases.
#
# Desarrollo:  docker compose up            (carga también docker-compose.override.yml)
# Producción:  docker compose -f docker-compose.yml up -d

name: diamante

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  image: diamante-backend:${VERSION:-local}
  restart: unless-stopped

# Variables de la aplicación que comparten la API y el worker. Las vacías se ignoran; en
# producción, DIAMANTE_URL_PUBLICA es obligatoria y el proceso no arranca sin ella.
x-entorno-app: &entorno-app
  DATABASE_URL: postgres://diamante_app:${DIAMANTE_APP_PASSWORD}@db:5432/diamante
  DIAMANTE_ENTORNO: ${DIAMANTE_ENTORNO:-produccion}
  DIAMANTE_URL_PUBLICA: ${DIAMANTE_URL_PUBLICA:-}
  DIAMANTE_ORIGENES: ${DIAMANTE_ORIGENES:-}
  DIAMANTE_CONFIAR_PROXY: ${DIAMANTE_CONFIAR_PROXY:-false}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: diamante
      POSTGRES_USER: diamante_propietario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      DIAMANTE_APP_PASSWORD: ${DIAMANTE_APP_PASSWORD:?Defina DIAMANTE_APP_PASSWORD en .env}
    volumes:
      - db_datos:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamante_propietario -d diamante"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Sin "ports": la base de datos no se expone fuera de la red de Docker (RNF-DES-02).

  migraciones:
    <<: *backend
    command: ["migrar"]
    environment:
      DATABASE_URL: postgres://diamante_propietario:${POSTGRES_PASSWORD}@db:5432/diamante
      DIAMANTE_ENTORNO: ${DIAMANTE_ENTORNO:-produccion}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *entorno-app
    depends_on:
      migraciones: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/diamante", "salud"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Envía los correos en cola (invitaciones y recuperación de contraseña).
  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *entorno-app
      DIAMANTE_SMTP_HOST: ${DIAMANTE_SMTP_HOST:-}
      DIAMANTE_SMTP_PUERTO: ${DIAMANTE_SMTP_PUERTO:-}
      DIAMANTE_SMTP_SEGURIDAD: ${DIAMANTE_SMTP_SEGURIDAD:-}
      DIAMANTE_SMTP_USUARIO: ${DIAMANTE_SMTP_USUARIO:-}
      DIAMANTE_SMTP_CLAVE: ${DIAMANTE_SMTP_CLAVE:-}
      DIAMANTE_SMTP_REMITENTE: ${DIAMANTE_SMTP_REMITENTE:-}
    depends_on:
      migraciones: { condition: service_completed_successfully }

volumes:
  db_datos:
