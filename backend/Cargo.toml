# Workspace del backend de Diamante Barbería.
# Monolito modular: un crate por módulo de negocio (modulos/*) y crates transversales (crates/*).
# Las versiones de las dependencias se declaran solo aquí y los crates las heredan con `workspace = true`.

[workspace]
resolver = "3"
members = ["crates/*", "modulos/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Crates internos
nucleo = { path = "crates/nucleo" }
contratos = { path = "crates/contratos" }
plataforma = { path = "crates/plataforma" }
identidad = { path = "modulos/identidad" }
negocio = { path = "modulos/negocio" }
catalogo = { path = "modulos/catalogo" }
barberos = { path = "modulos/barberos" }
clientes = { path = "modulos/clientes" }
verificacion = { path = "modulos/verificacion" }
agenda = { path = "modulos/agenda" }
ventas = { path = "modulos/ventas" }
reportes = { path = "modulos/reportes" }
notificaciones = { path = "modulos/notificaciones" }
archivos = { path = "modulos/archivos" }
auditoria = { path = "modulos/auditoria" }
trabajos = { path = "modulos/trabajos" }

# Dependencias externas
aes-gcm = "0.11.1"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
getrandom = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1"
imagesize = "0.15.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1-rustls", "rustls-tls", "ring"] }
# Cliente HTTP solo para Gotenberg (red interna: sin TLS).
reqwest = { version = "0.12", default-features = false, features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "derive", "migrate", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time", "sync", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"

# Argon2 sin optimizar tarda segundos por contraseña: se optimiza también en desarrollo y pruebas.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
